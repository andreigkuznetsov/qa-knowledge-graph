plugins {
    id 'java-library'
}

dependencies {
    api 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.networknt:json-schema-validator:1.5.8'

    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'qaip.repositoryRoot', rootProject.projectDir.absolutePath
}

tasks.named('processTestResources') {
    from(rootProject.file('schemas/project/v1')) {
        include '*.schema.json'
        into 'schemas'
    }
    from(project(':qa-model').file('src/main/resources/schema')) {
        include 'qa-model-v0.1.schema.json'
        into 'schemas'
    }
}
